<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09051b" />
    <meta name="description" content="TankChef: arcade turn-based artillery in your browser. Hot-seat, against AI, or online." />
    <title>TankChef // Arcade Mode</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f1a'/%3E%3Cpath d='M16 18 L26 9' stroke='%23c8ccd4' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M9 19a7 7 0 0 1 14 0z' fill='%23e8453c'/%3E%3Crect x='5' y='19' width='22' height='6' rx='3' fill='%23e8453c'/%3E%3Crect x='4' y='24' width='24' height='4' rx='2' fill='%2323262c'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="stage">
      <canvas id="game" aria-label="TankChef battlefield"></canvas>
    </main>
    <div id="arcade-decor" aria-hidden="true">
      <div class="arcade-sign">INSERT COIN <span>★</span> PLAYER 1</div>
      <div class="pixel-pacman"></div>
      <div class="pixel-ghost ghost-pink"></div>
      <div class="pixel-ghost ghost-cyan"></div>
      <div class="arcade-side side-left">1UP<br><b>025000</b><br>♥ ♥ ♥</div>
      <div class="arcade-side side-right">HIGH SCORE<br><b>999999</b><br>READY!</div>
      <div class="arcade-bottom">◆ 8-BIT BATTLE ◆ PRESS START ◆ PIXEL POWER ◆</div>
    </div>
    <div id="ui"></div>
    <div id="touch" class="touch" hidden></div>
    <div id="arsenal" class="arsenal" hidden></div>
    <div id="chat" class="chat" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <noscript>TankChef needs JavaScript enabled.</noscript>
    <!-- If the game's files can't be loaded (an old cached copy of this page after an update
         moved them), reload once to get the current page. -->
    <script
      type="module"
      src="src/main.js"
      onerror="try { if (!sessionStorage.getItem('scorched-tanks-reload')) { sessionStorage.setItem('scorched-tanks-reload', '1'); location.reload(); } } catch (e) {}"
    ></script>
  </body>
</html>
